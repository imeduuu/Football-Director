name: CI

on:
  push:
  pull_request:

jobs:
  build-test-format:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python for SQLite schema checks
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Restore
        run: dotnet restore BoardroomTouchline.sln

      - name: Build
        run: dotnet build BoardroomTouchline.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test BoardroomTouchline.sln --no-build --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Test SQLite schema and constraints
        run: python -m unittest discover -s tests/schema -v

      - name: Verify formatting
        run: dotnet format BoardroomTouchline.sln --verify-no-changes --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
